name: Build offline Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign_installer:
        description: Request SignPath signing of the offline installer from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      signing-artifact-id: ${{ steps.upload-signing-input.outputs.artifact-id }}
      version: ${{ steps.signing-metadata.outputs.version }}
      signpath-version: ${{ steps.signing-metadata.outputs.signpath-version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\G321-DotNet
        with:
          dotnet-version: '10.0.404'

      - name: Get the Inno Setup compiler
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'G321-Inno'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup download did not match the published SHA-256.'
          }
          $argsForSetup = @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $compilerDir))
          $setupProcess = Start-Process -FilePath $download -ArgumentList $argsForSetup -PassThru -Wait -WindowStyle Hidden
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if ($setupProcess.ExitCode -ne 0 -or !(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Could not install the Inno Setup compiler (exit $($setupProcess.ExitCode))."
          }

      - name: Download Equalizer APO
        run: |
          $vendor = Join-Path $env:RUNNER_TEMP 'G321-EqualizerAPO'
          $null = New-Item -ItemType Directory -Path $vendor
          $base = 'https://downloads.sourceforge.net/project/equalizerapo/1.4.2'
          foreach ($package in 'x64', 'x86', 'ARM64', 'src') {
            $extension = if ($package -eq 'src') { 'zip' } else { 'exe' }
            $file = "EqualizerAPO-$package-1.4.2.$extension"
            curl.exe --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 180 --output (Join-Path $vendor $file) "$base/$file"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download $file (exit $LASTEXITCODE)."
            }
          }

      - name: Build and hash the offline installer
        run: |
          if ((dotnet --version) -ne '10.0.404' -or $LASTEXITCODE -ne 0) {
            throw 'The build must select .NET SDK 10.0.404.'
          }
          ./installer/Build-OfflineSetup.ps1 `
            -ApoDirectory (Join-Path $env:RUNNER_TEMP 'G321-EqualizerAPO') `
            -InnoCompiler (Join-Path $env:RUNNER_TEMP 'G321-Inno/ISCC.exe')

          $setup = Get-Item -LiteralPath 'dist/G321 Studio Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($setup.Name)" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Check installer metadata for SignPath
        id: signing-metadata
        if: github.repository == 'gleyssonsc/g321-studio' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.sign_installer
        run: |
          $setup = Get-Item -LiteralPath 'dist/G321 Studio Setup.exe'
          $versionInfo = $setup.VersionInfo
          $project = [xml](Get-Content -LiteralPath 'G321Studio.csproj' -Raw)
          $version = [string]$project.Project.PropertyGroup.Version

          # Inno Setup 6.7.3 pads these resource strings with spaces.
          if ([string]::IsNullOrWhiteSpace($version) -or
              $versionInfo.ProductName -cne 'G321 Studio'.PadRight(60) -or
              $versionInfo.ProductVersion -cne $version.PadRight(50)) {
            throw 'The installer metadata does not match G321 Studio and the version in G321Studio.csproj.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "signpath-version=$(ConvertTo-Json -InputObject $versionInfo.ProductVersion -Compress)" >> $env:GITHUB_OUTPUT

      - name: Upload SignPath input
        id: upload-signing-input
        if: steps.signing-metadata.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g321-studio-signing-input
          path: dist/G321 Studio Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer and checksum
        if: steps.signing-metadata.outcome == 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g321-studio-offline-installer
          path: |
            dist/G321 Studio Setup.exe
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  sign:
    if: needs.build.outputs.signing-artifact-id != ''
    needs: build
    runs-on: windows-2025
    timeout-minutes: 85
    environment: signpath
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check SignPath configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN'
            'SIGNPATH_ORGANIZATION_ID'
            'SIGNPATH_PROJECT_SLUG'
            'SIGNPATH_SIGNING_POLICY_SLUG'
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing) {
            throw "Configure the signpath environment before requesting signing. Missing: $($missing -join ', ')."
          }

      - name: Request signing and download the approved installer
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.signing-artifact-id }}
          parameters: |
            version: ${{ needs.build.outputs.signpath-version }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          download-signed-artifact-timeout-in-seconds: 900
          output-artifact-directory: ${{ runner.temp }}/G321-Signed

      - name: Verify Authenticode and hash the signed installer
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'G321-Signed'
          $setup = Get-Item -LiteralPath (Join-Path $signed 'G321 Studio Setup.exe')
          if ($setup.VersionInfo.ProductName.TrimEnd() -cne 'G321 Studio' -or
              $setup.VersionInfo.ProductVersion.TrimEnd() -cne $env:EXPECTED_VERSION) {
            throw 'The signed installer metadata does not match the build.'
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or
              !$signature.SignerCertificate -or !$signature.TimeStamperCertificate -or
              $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -cne 'SignPath Foundation') {
            throw 'Expected a valid embedded Authenticode signature from SignPath Foundation with a timestamp.'
          }

          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($setup.Name)" | Set-Content -LiteralPath (Join-Path $signed 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload signed installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g321-studio-offline-installer-signed
          path: |
            ${{ runner.temp }}/G321-Signed/G321 Studio Setup.exe
            ${{ runner.temp }}/G321-Signed/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
